[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battleship-ai"
version = "0.1.0"
description = "Local Battleship platform for AI competitions"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.88",
]
ui = [
    "pygame>=2.5",
]
ml = [
    "torch>=2.0",
    "matplotlib>=3.7",
]

[project.scripts]
battleship = "app.cli:main"

[tool.setuptools]
py-modules = [
    "agent",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "battleship*", "bots*", "core*", "runtime*", "sdk*", "ui*"]

[tool.setuptools.package-data]
ui = ["spectator.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ui: tests requiring pygame",
]
